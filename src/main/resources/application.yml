spring:
  application:
    name: growwithus-server
  config:
    # 로컬 .env 파일이 있으면 읽는다 (.env.example 참고). OS 환경변수가 항상 우선한다.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # MariaDB 11.6부터 기본인 innodb_snapshot_isolation에서는 REPEATABLE READ 트랜잭션이 먼저 읽은 뒤에 행을 잠그거나
      # (select ... for update) 고칠 때, 그 사이 다른 요청이 그 행을 바꿨으면 "Record has changed since last read"로 실패한다.
      # 텃밭을 잠그고 XP나 스트릭을 고치는 API가 동시에 들어와도 차례로 처리되도록 READ COMMITTED를 쓴다
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      # 사진 10MB, 음성 60초 제한은 FileUploadService가 검증한다. 여기는 요청 전체의 상한이다.
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    # 날짜는 YYYY-MM-DD, 시각은 ISO 8601 +09:00으로 내려준다
    time-zone: Asia/Seoul
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-dates-with-context-time-zone: true

jwt:
  access-token:
    expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token:
    expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:604800000}

file:
  # 저장소 구현체 선택. 현재는 local만 있다
  storage: ${FILE_STORAGE:local}

external:
  http:
    connect-timeout: ${EXTERNAL_HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_HTTP_READ_TIMEOUT:30s}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

demo:
  # 시연 계정(minji, soonja)의 비밀번호. 8자 이상으로 넣으면 부팅할 때 시연 계정과 텃밭을 만든다.
  # 비워 두면 만들지 않는다. demo.enabled는 프로필별 yml에 있다
  seed-password: ${DEMO_SEED_PASSWORD:}
  seed-visit-enabled: ${DEMO_SEED_VISIT_ENABLED:false}

# 기상청 단기예보 조회서비스 (docs/public-data.md). 인증키를 비워 두어도 부팅되고, 그때는 날씨 수집을 건너뛴다
weather:
  kma:
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    max-attempts: ${KMA_MAX_ATTEMPTS:3}
    retry-delay: ${KMA_RETRY_DELAY:1s}
  sync:
    # 농장 도메인이 붙기 전까지 수집할 격자. "nx:ny"를 콤마로 잇는다. 기본값은 용인시 처인구 대표 격자
    default-grids: "${WEATHER_DEFAULT_GRIDS:64:119}"

# LLM, STT, TTS. 제공자와 구현체가 정해질 때까지는 비워 두어도 부팅된다
ai:
  gemini:
    enabled: ${AI_GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  local-tts:
    enabled: ${AI_LOCAL_TTS_ENABLED:false}
    base-url: ${AI_LOCAL_TTS_BASE_URL:http://127.0.0.1:8766}
  local-stt:
    enabled: ${AI_LOCAL_STT_ENABLED:false}
    base-url: ${AI_LOCAL_STT_BASE_URL:http://127.0.0.1:8765}
  local:
    enabled: ${AI_LOCAL_ENABLED:false}
    base-url: ${AI_LOCAL_BASE_URL:http://127.0.0.1:11434}
    model: ${AI_LOCAL_MODEL:}
    vision-model: ${AI_LOCAL_VISION_MODEL:}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:}
    model: ${LLM_MODEL:}
  stt:
    api-key: ${STT_API_KEY:}
    base-url: ${STT_BASE_URL:}
    model: ${STT_MODEL:}
  tts:
    api-key: ${TTS_API_KEY:}
    base-url: ${TTS_BASE_URL:}
    model: ${TTS_MODEL:}
    voice: ${TTS_VOICE:}

care:
  allowance-per-task: ${CARE_ALLOWANCE_PER_TASK:0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 배포 헬스체크용. health만 공개하고 상세 정보는 내보내지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
