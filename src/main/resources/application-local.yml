spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:growwithus-server}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET_KEY:bG9jYWwtb25seS1kZXYtc2VjcmV0LWtleS1mb3Itc3ByaW5nLWluaXRpYWxpemUtZG8tbm90LXVzZS1pbi1wcm9k}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

internal:
  service-key: ${INTERNAL_SERVICE_KEY:local-internal-service-key}

demo:
  enabled: ${DEMO_ENABLED:true}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080}

logging:
  level:
    community.likelion.growwithusserver: DEBUG
    org.hibernate.SQL: DEBUG
