name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - run: chmod +x ./gradlew && ./gradlew bootJar unitTest --no-daemon

      - run: python3 -m unittest discover -s deploy -p 'test_*.py'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
