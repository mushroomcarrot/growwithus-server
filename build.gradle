plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'community.likelion'
version = '0.0.1-SNAPSHOT'
description = 'growwithus-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Asia/Seoul'
    reports.junitXml.outputLocation = layout.buildDirectory.dir('reports/junit')
}

// 사용자가 명시적으로 실행할 때만 로컬 모델을 호출한다. 일반 test와 build에는 포함하지 않는다.
tasks.register('evaluateLocalAi', JavaExec) {
    group = 'verification'
    description = '로컬 LLM의 한국어 이상 징후 추출과 지연 측정'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'community.likelion.growwithusserver.ai.evaluation.LocalAiEvaluation'
    args layout.buildDirectory.file('reports/local-ai-evaluation.json').get().asFile.absolutePath
}

// DB 연결을 사용하는 컨텍스트 및 영속성 검사는 기존 test 태스크에 남긴다.
tasks.register('unitTest', Test) {
    group = 'verification'
    description = '외부 DB 없이 실행하는 서비스 및 로직 테스트'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Asia/Seoul'
    exclude '**/GrowwithusServerApplicationTests.class'
    exclude '**/AiDomainContextTest.class'
    exclude '**/AiCompletionPersistenceTest.class'
}
// 설치된 로컬 모델의 실제 동작 확인. 일반 test와 build에서는 실행하지 않는다.
tasks.register('verifyLocalAi', JavaExec) {
    group = 'verification'
    description = '로컬 STT, LLM, TTS 및 사진 비전 실제 동작 검사'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'community.likelion.growwithusserver.ai.evaluation.AiPredeployCheck'
    args layout.buildDirectory.dir('reports/ai-fixtures').get().asFile.absolutePath,
            layout.buildDirectory.file('reports/ai-predeploy.json').get().asFile.absolutePath
}
